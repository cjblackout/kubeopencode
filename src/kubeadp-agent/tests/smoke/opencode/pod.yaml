apiVersion: v1
kind: Pod
metadata:
  name: oc-smoke
  namespace: __SMOKE_NAMESPACE__
  labels:
    app: oc-smoke
spec:
  restartPolicy: Never
__SMOKE_RUNTIME_CLASS__
__SMOKE_NODE_SELECTOR__
  securityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: mock
    image: __SMOKE_IMAGE__
    command: ["node", "/scripts/mock-llm.js"]
    volumeMounts:
    - {name: scripts, mountPath: /scripts}
    - {name: work, mountPath: /work}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: "1", memory: 256Mi}
  - name: smoke
    image: __SMOKE_IMAGE__
    command: ["bash", "/scripts/smoke.sh"]
    volumeMounts:
    - {name: scripts, mountPath: /scripts}
    - {name: work, mountPath: /work}
    # Temporary workaround (KA-9): emptyDir workspace mount
    - {name: pa, mountPath: /workspace}
    resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: "4", memory: 2Gi}
  volumes:
  - {name: pa, emptyDir: {}}
  - {name: work, emptyDir: {sizeLimit: 2Gi}}
  - {name: scripts, configMap: {name: oc-smoke-scripts, defaultMode: 493}}
