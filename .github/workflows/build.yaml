name: build

# Homelab fork pipeline: builds the operator image, the opencode agent image,
# the attach image and the Helm chart, pushes them to GHCR under
# ghcr.io/cjblackout and tags the commit.
#
# Versioning: <upstream-base>-hl.<N>, e.g. v0.1.9-hl.3. The base comes from
# the file VERSION; N is the next free counter among the existing git tags
# <base>-hl.* (so the pipeline sequences itself, like the homelab builds).
# Chart.yaml version/appVersion are rewritten in the build workspace only
# (nothing is committed back).
#
# Runs on GitHub-hosted runners: the homelab ARC scale set is registered to
# cjblackout/homelab only and cannot serve this repository.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ORG: cjblackout

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version }}
      semver: ${{ steps.calc.outputs.semver }}
      opencode: ${{ steps.calc.outputs.opencode }}
    steps:
      - uses: actions/checkout@v7
      - id: calc
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          case "$BASE" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::VERSION must look like v0.1.9"; exit 1 ;; esac
          ESC="${BASE//./\\.}"
          TAGS="$(git ls-remote --tags origin | awk -F'\t' '{t=$2; sub(/^refs\/tags\//,"",t); print t}')"
          MAX="$(printf '%s\n' "$TAGS" | grep -oE "^${ESC}-hl\.[0-9]+$" | grep -oE '[0-9]+$' | sort -n | tail -1 || true)"
          V="${BASE}-hl.$(( ${MAX:-0} + 1 ))"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "semver=${V#v}" >> "$GITHUB_OUTPUT"
          echo "opencode=$(grep '^OPENCODE_VERSION' agents/Makefile | head -1 | sed 's/.*?= *//')" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${V}"

  operator:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build UI
        run: cd ui && pnpm install --frozen-lockfile && pnpm run build
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/kubeopencode:${{ needs.version.outputs.version }}

  agent-opencode:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./agents/opencode
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_VERSION=${{ needs.version.outputs.opencode }}
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/kubeopencode-agent-opencode:${{ needs.version.outputs.version }}

  agent-attach:
    needs: [version, agent-opencode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./agents/attach
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPENCODE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/kubeopencode-agent-opencode:${{ needs.version.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/kubeopencode-agent-attach:${{ needs.version.outputs.version }}

  chart:
    needs: [version, operator]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          set -euo pipefail
          C=charts/kubeopencode
          sed -i -E "s/^version:.*/version: ${SEMVER}/; s/^appVersion:.*/appVersion: \"${VERSION}\"/" $C/Chart.yaml
          sed -i "s#ghcr.io/kubeopencode/kubeopencode#ghcr.io/cjblackout/kubeopencode#g" $C/values.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p dist
          helm package $C -d dist/
          helm push dist/kubeopencode-${SEMVER}.tgz oci://ghcr.io/cjblackout/helm-charts

  tag:
    needs: [version, operator, agent-opencode, agent-attach, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tag release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # REST API instead of git push (works when main moved during the build); 422 = exists.
          code=$(curl -sS -o /tmp/tag.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d "{\"ref\":\"refs/tags/${VERSION}\",\"sha\":\"${{ github.sha }}\"}")
          if [ "$code" != 201 ] && [ "$code" != 422 ]; then cat /tmp/tag.json; echo "tag creation failed: HTTP $code" >&2; exit 1; fi
